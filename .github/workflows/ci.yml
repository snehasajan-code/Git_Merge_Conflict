name: DevOps Java CI Automation Pipeline

on:
  push:
    branches: ["main", "lab5-matrix-testing"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      - name: Run Automated Test Suites
        working-directory: maven-lab/maven-demo
        run: mvn test
